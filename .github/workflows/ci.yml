name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Harness Factory unit tests
        run: npm run test:ci

      - name: CLI smoke (autoskills registry)
        run: node scripts/harness-factory.js catalog refresh

      - name: No embedded skills directory
        run: test ! -d skills