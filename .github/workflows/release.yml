name: release

# Manual only — Harness Factory is private and does not auto-publish to npm.
# Run from Actions when you are ready to cut a version and publish (requires NPM_TOKEN).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (before publish)
        type: choice
        options: [patch, minor, major]
        default: patch
      publish:
        description: Publish to npm after tests
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run test:ci
      - run: node scripts/harness-factory.js catalog refresh

  release:
    needs: verify
    if: github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Bump version
        run: npm version "${{ inputs.bump }}" --no-git-tag-version
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Tag release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          git tag -a "$V" -m "Release $V"
          git push origin "$V"
          gh release create "$V" --title "$V" --generate-notes